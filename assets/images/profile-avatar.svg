<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="200" cy="200" r="195" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Inner Circle with Scholar Gradient -->
  <circle cx="200" cy="200" r="180" fill="url(#avatarGrad)"/>

  <!-- Subtle mesh lattice lines representing LBM / BEM grid -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="60" y1="120" x2="340" y2="120"/>
    <line x1="40" y1="200" x2="360" y2="200"/>
    <line x1="60" y1="280" x2="340" y2="280"/>
    <line x1="120" y1="60" x2="120" y2="340"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
    <line x1="280" y1="60" x2="280" y2="340"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="4,4"/>
  </g>

  <!-- Stylized Scholar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="#f8fafc"/>
  <!-- Shoulders / Torso -->
  <path d="M 100 320 C 100 240, 140 225, 200 225 C 260 225, 300 240, 300 320 Z" fill="#f8fafc"/>

  <!-- Monogram Initials "RM" in torso center -->
  <text x="200" y="295" fill="#0369a1" font-family="'Times New Roman', Times, serif" font-size="52" font-weight="bold" text-anchor="middle">RM</text>

  <!-- IIT Kharagpur Banner Pill at bottom -->
  <rect x="70" y="335" width="260" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="358" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">IIT KHARAGPUR</text>
</svg>
