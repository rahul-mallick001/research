<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ehdBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="dropEhd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="ehdArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#f43f5e"/>
    </marker>
    <marker id="vortArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="12" fill="url(#ehdBg)"/>
  
  <text x="30" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">ELECTROHYDRODYNAMICS (EHD) &amp; DROPLET DYNAMICS</text>
  <text x="30" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Taylor-Melcher Leaky Dielectric Model: Quadrupolar Circulation</text>

  <!-- External Applied Electric Field E0 (Vertical or Horizontal) -->
  <g stroke="#f59e0b" stroke-width="1.8">
    <line x1="80" y1="120" x2="720" y2="120" marker-end="url(#ehdArr)"/>
    <line x1="80" y1="180" x2="260" y2="180"/>
    <line x1="540" y1="180" x2="720" y2="180" marker-end="url(#ehdArr)"/>
    <line x1="80" y1="300" x2="260" y2="300"/>
    <line x1="540" y1="300" x2="720" y2="300" marker-end="url(#ehdArr)"/>
    <line x1="80" y1="360" x2="720" y2="360" marker-end="url(#ehdArr)"/>
  </g>
  <text x="620" y="108" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Electric Field E_0 →</text>

  <!-- Droplet Interface (Deformed Ellipse) -->
  <ellipse cx="400" cy="240" rx="150" ry="110" fill="url(#dropEhd)" stroke="#0ea5e9" stroke-width="2.5"/>

  <!-- Surface Free Charges (q_s) Induced at Interface -->
  <!-- Positive on right pole, negative on left pole -->
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="bold">
    <!-- Right pole charges: Positive -->
    <text x="535" y="246" fill="#ef4444">+</text>
    <text x="525" y="210" fill="#ef4444">+</text>
    <text x="525" y="278" fill="#ef4444">+</text>
    <text x="495" y="170" fill="#ef4444">+</text>
    <text x="495" y="320" fill="#ef4444">+</text>

    <!-- Left pole charges: Negative -->
    <text x="255" y="246" fill="#38bdf8">−</text>
    <text x="265" y="210" fill="#38bdf8">−</text>
    <text x="265" y="278" fill="#38bdf8">−</text>
    <text x="295" y="170" fill="#38bdf8">−</text>
    <text x="295" y="320" fill="#38bdf8">−</text>
  </g>

  <!-- 4-Quadrant Circulation Vortices (Taylor-Melcher circulation) -->
  <!-- Top Right Quadrant Vortex -->
  <path d="M 460 210 A 35 25 0 1 1 450 170" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#vortArr)"/>
  <!-- Top Left Quadrant Vortex -->
  <path d="M 350 170 A 35 25 0 1 1 340 210" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#vortArr)"/>
  <!-- Bottom Left Quadrant Vortex -->
  <path d="M 340 270 A 35 25 0 1 1 350 310" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#vortArr)"/>
  <!-- Bottom Right Quadrant Vortex -->
  <path d="M 450 310 A 35 25 0 1 1 460 270" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#vortArr)"/>

  <!-- Tangential Electrical Stresses (τ_e = q_s · E_t) -->
  <path d="M 470 145 Q 400 130 330 145" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#ehdArr)"/>
  <text x="350" y="125" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Interfacial Shear Stress τ_e = q_s E_t</text>

  <!-- Labels -->
  <text x="360" y="245" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Droplet Fluid</text>
  <text x="345" y="262" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Conductivity σ_d, Permittivity ε_d</text>
  
  <text x="80" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Dielectric Ambient Fluid (σ_m, ε_m)</text>

  <!-- Governing Box -->
  <rect x="50" y="400" width="700" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="70" y="422" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Interfacial Electrohydrodynamic Jump Conditions:</text>
  <text x="70" y="442" fill="#f8fafc" font-family="monospace" font-size="12">[[ n·T^H ]] + [[ n·T^M ]] = γ κ n   |   [[ n·(σ E + ∂(ε E)/∂t) ]] + ∇_s · (q_s u_s) = 0</text>
</svg>
